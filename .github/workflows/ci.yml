name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  GODOT_VERSION: "4.7.2-stable"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python-unit:
    name: Python unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r ai/requirements.txt
      - name: Validate dependency installation
        run: python -c "import gymnasium, numpy, stable_baselines3, torch; print(gymnasium.__version__, numpy.__version__, stable_baselines3.__version__, torch.__version__)"
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  godot-regression:
    name: Godot headless regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r ai/requirements.txt
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ runner.os }}
      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          version="${GODOT_VERSION}"
          directory="${RUNNER_TEMP}/godot"
          mkdir -p "$directory"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            asset="Godot_v${version}_win64.exe.zip"
            binary="${directory}/Godot_v${version}_win64.exe"
          else
            asset="Godot_v${version}_linux.x86_64.zip"
            binary="${directory}/Godot_v${version}_linux.x86_64"
          fi
          if [[ ! -f "$binary" ]]; then
            curl -fsSL --retry 3 --retry-delay 2 \
              -o "${directory}/${asset}" \
              "https://github.com/godotengine/godot/releases/download/${version}/${asset}"
            unzip -q -o "${directory}/${asset}" -d "$directory"
          fi
          chmod +x "$binary" || true
          "$binary" --version
          echo "GODOT_BIN=${binary}" >> "$GITHUB_ENV"
      - name: Run Godot, schema, smoke, and replay integration checks
        shell: bash
        run: |
          python tests/run_checks.py --godot "$GODOT_BIN" --skip-python \
            --report ai/runs/project_checks.json
      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-regression-${{ runner.os }}
          if-no-files-found: warn
          path: |
            ai/runs/project_checks.json
            ai/runs/*.log
            ai/runs/godot_*.log

  training-smoke:
    name: Training and replay smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r ai/requirements.txt
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ runner.os }}
      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          version="${GODOT_VERSION}"
          directory="${RUNNER_TEMP}/godot"
          mkdir -p "$directory"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            asset="Godot_v${version}_win64.exe.zip"
            binary="${directory}/Godot_v${version}_win64.exe"
          else
            asset="Godot_v${version}_linux.x86_64.zip"
            binary="${directory}/Godot_v${version}_linux.x86_64"
          fi
          if [[ ! -f "$binary" ]]; then
            curl -fsSL --retry 3 --retry-delay 2 \
              -o "${directory}/${asset}" \
              "https://github.com/godotengine/godot/releases/download/${version}/${asset}"
            unzip -q -o "${directory}/${asset}" -d "$directory"
          fi
          chmod +x "$binary" || true
          "$binary" --version
          echo "GODOT_BIN=${binary}" >> "$GITHUB_ENV"
      - name: Short PPO training smoke
        shell: bash
        run: |
          python ai/train.py \
            --steps 64 \
            --n-envs 1 \
            --seed 7331 \
            --run-name ci_smoke \
            --output-root ai/runs/ci_smoke \
            --eval-every 0 \
            --early-stop-patience 0 \
            --godot "$GODOT_BIN"
      - name: Evaluation smoke with episode recording
        shell: bash
        run: |
          python ai/evaluate.py \
            --model ai/runs/ci_smoke/models/ci_smoke.zip \
            --episodes 1 \
            --seed 20000 \
            --curriculum-stage 0 \
            --godot "$GODOT_BIN" \
            --record ai/runs/ci_smoke/episode.jsonl
      - name: Deterministic replay smoke
        shell: bash
        run: |
          python ai/replay_episode.py \
            --recording ai/runs/ci_smoke/episode.jsonl \
            --godot "$GODOT_BIN" \
            --atol 1e-5 \
            --rtol 1e-6 \
            --json ai/runs/ci_smoke/replay_report.json
      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-smoke-${{ runner.os }}
          if-no-files-found: warn
          path: |
            ai/runs/ci_smoke/
            ai/runs/godot_*.log
